name: MarginMatch Portable CI

on:
  push:
    branches:
      - marginmatch-migration
    paths:
      - 'marginmatch-migration/**'
      - '.github/workflows/marginmatch-portable-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marginmatch-migration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck portable runtime
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Run portable API contract tests
        run: npm test

      - name: Run portable workflow integration harness
        run: npm run test:workflow

      - name: Confirm deployed portable frontend has no AppDeploy dependency
        run: |
          if grep -E "^[[:space:]]*import .*@appdeploy/client|^[[:space:]]*import App from './App'" \
            src/main.tsx src/platform-client.ts src/MattressRescueStorefront.tsx \
            src/OwnerCockpit.tsx src/PortableOperations.tsx; then
            echo "Deployed portable frontend still imports AppDeploy or legacy App."
            exit 1
          fi

      - name: Confirm migration safety locks
        run: |
          test -f DEPLOY.md
          test -f backend/platform-postgres.ts
          test -f backend/secrets-env.ts
          test -f backend/ai-openai.ts
          test -f src/platform-client.ts
