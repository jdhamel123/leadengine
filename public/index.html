<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1b2a">
  <title>MarginMatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="mark">M</span><span>MarginMatch</span></div>
    <nav id="nav"></nav>
    <div class="sidebar-foot"><div class="autopilot"><span class="dot"></span><div><strong>Autopilot active</strong><small>Human review only on exceptions</small></div></div></div>
  </aside>
  <main>
    <header class="topbar"><div><p class="eyebrow">DUMPSTER RENTAL ARBITRAGE</p><h1 id="title">Control Center</h1></div><button class="primary" data-action="new-order">+ New order</button></header>
    <section id="content" class="content"></section>
  </main>
  <nav id="mobile-nav" class="mobile-nav"></nav>
</div>
<div id="modal" class="modal-wrap" hidden></div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
