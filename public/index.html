<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12231d">
  <title>LeadEngine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#dashboard" aria-label="LeadEngine home"><span class="brand-mark">L</span><span>Lead<span>Engine</span></span></a>
      <nav id="desktop-nav" aria-label="Main navigation"></nav>
      <div class="sidebar-foot">
        <div class="help-card"><span class="icon-circle">?</span><strong>Need a hand?</strong><small>Explore our quick-start guide</small><button>View guide</button></div>
        <div class="user-chip"><span class="avatar">AM</span><span><strong>Alex Morgan</strong><small>Administrator</small></span><button aria-label="More options">•••</button></div>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div><p class="eyebrow">WEDNESDAY, AUG 19</p><h1 id="page-title">Good morning, Alex</h1></div>
        <div class="top-actions"><button class="icon-btn" aria-label="Notifications">♢<span></span></button><button class="primary" data-action="new-lead">＋ <span>New lead</span></button></div>
      </header>
      <div id="content" class="content"></div>
    </main>
    <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile navigation"></nav>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <div class="modal-wrap" id="modal" hidden></div>
  <script src="app.js"></script>
</body>
</html>
